<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="cornerGlow" cx="95%" cy="5%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.5; r: 3.5px; }
        50% { opacity: 1; r: 4.5px; }
      }
      .pulsing-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="176" rx="12" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="876" height="176" rx="12" fill="url(#cornerGlow)" />

  <!-- Top Status Row -->
  <circle cx="28" cy="30" r="4" fill="#38bdf8" class="pulsing-dot" />
  <text x="40" y="34" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">
    MACHINE LEARNING &amp; AI SYSTEMS ENGINEER
  </text>

  <!-- Location Badge -->
  <text x="740" y="34" fill="#64748b" font-size="11" font-weight="500" class="font-mono">
    📍 Chandigarh, India
  </text>

  <!-- Divider -->
  <line x1="26" y1="48" x2="854" y2="48" stroke="#1e293b" stroke-width="1" />

  <!-- Name & Title -->
  <text x="26" y="94" fill="url(#textGrad)" font-size="34" font-weight="800" class="font-sans" letter-spacing="-0.8">
    Vishal Singh
  </text>

  <!-- Tagline / Elevator Pitch -->
  <text x="26" y="124" fill="#cbd5e1" font-size="14.5" font-weight="400" class="font-sans">
    Transforming high-volume spatial streams &amp; telemetry into predictive engines and intuitive multimodal AI.
  </text>

  <!-- Bottom Tech Pills / Focus Areas -->
  <text x="26" y="155" fill="#64748b" font-size="11.5" class="font-mono">
    FOCUS: <tspan fill="#38bdf8">DTUMOS (Urban Mobility Twin)</tspan> • <tspan fill="#34d399">GTFS-RT Telemetry</tspan> • <tspan fill="#c084fc">Multimodal GenAI</tspan> • <tspan fill="#e2e8f0">Sabudh ML</tspan>
  </text>
</svg>
