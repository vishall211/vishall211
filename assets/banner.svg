<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="modernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <radialGradient id="softGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="138" rx="12" fill="url(#modernBg)" stroke="#1e293b" stroke-width="1" />
  <rect x="1" y="1" width="878" height="138" rx="12" fill="url(#softGlow)" />

  <!-- Top Subtle Tag -->
  <text x="32" y="38" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1" class="mono">
    SOFTWARE ENGINEER • BUILDER
  </text>
  <text x="750" y="38" fill="#64748b" font-size="12" font-weight="400" class="sans">
    Chandigarh, India
  </text>

  <!-- Name -->
  <text x="32" y="80" fill="url(#nameGradient)" font-size="32" font-weight="700" letter-spacing="-0.5" class="sans">
    Vishal Singh
  </text>

  <!-- Subtitle -->
  <text x="32" y="108" fill="#94a3b8" font-size="14.5" font-weight="400" class="sans">
    Building clean web and mobile applications, reliable backend systems, and data tools.
  </text>
</svg>
