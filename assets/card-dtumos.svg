<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="60%" stop-color="#0c172e" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      @keyframes pulsePing {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 12px; opacity: 0.2; }
      }
      .ping-pulse { animation: pulsePing 2s infinite ease-out; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="876" height="196" rx="14" fill="url(#cardBg)" stroke="#0284c7" stroke-width="1.2" />

  <!-- Left Content Area -->
  <g transform="translate(30, 28)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
    <text x="10" y="16" fill="#38bdf8" font-size="11" font-weight="700" class="font-code">
      🚌 SPATIAL TELEMETRY &amp; ML
    </text>

    <!-- Project Title -->
    <text x="0" y="52" fill="url(#cyanGrad)" font-size="22" font-weight="800" class="font-main">
      DTUMOS • Digital Twin for Urban Mobility
    </text>

    <!-- Description -->
    <text x="0" y="78" fill="#cbd5e1" font-size="13" class="font-main">
      Real-time transit modeling and arrival forecasting engine using sparse, low-frequency GPS streams.
    </text>
    <text x="0" y="98" fill="#94a3b8" font-size="12" class="font-main">
      Isolates passenger boarding dwell times and forecasts stop-level bus ETAs during peak congestion.
    </text>

    <!-- Pipeline / Architecture Strip -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="560" height="26" rx="6" fill="#040813" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="17" fill="#64748b" font-size="11" class="font-code">
        GTFS-RT Telemetry ➔ Automated Daily ETL ➔ Spatial Ingestion ➔ Live ETA Estimator
      </text>
    </g>
  </g>

  <!-- Right Visual Illustration (Digital Twin GPS Map & Telemetry Graph) -->
  <g transform="translate(630, 20)">
    <!-- Mini Map Background Grid -->
    <rect x="0" y="0" width="210" height="155" rx="10" fill="#050a14" stroke="#1e293b" stroke-width="1" />
    
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="210" y2="40" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="0" y1="80" x2="210" y2="80" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="0" y1="120" x2="210" y2="120" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="70" y1="0" x2="70" y2="155" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="140" y1="0" x2="140" y2="155" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />

    <!-- Spatial Transit Path Curve -->
    <path d="M 20,130 C 60,110 80,40 140,50 S 190,110 190,110" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowEffect)" />
    
    <!-- Transit Stops -->
    <circle cx="20" cy="130" r="4" fill="#ffffff" />
    <circle cx="95" cy="55" r="4" fill="#38bdf8" />
    <circle cx="190" cy="110" r="4" fill="#ffffff" />

    <!-- Live Vehicle GPS Ping -->
    <circle cx="95" cy="55" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ping-pulse" />
    
    <!-- Telemetry Metric Tag -->
    <rect x="25" y="15" width="105" height="20" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
    <text x="32" y="29" fill="#38bdf8" font-size="10" font-weight="700" class="font-code">ETA: 3m 45s • OK</text>
  </g>
</svg>
