<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Subtle Shimmer Line Gradient -->
    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Corner Glow -->
    <radialGradient id="cornerGlow" cx="90%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

      @keyframes glide {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(900px); }
      }
      .shimmer-bar {
        animation: glide 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes softPulse {
        0%, 100% { opacity: 0.5; r: 3.5px; }
        50% { opacity: 1; r: 4.5px; }
      }
      .pulse-dot {
        animation: softPulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="146" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="876" height="146" rx="14" fill="url(#cornerGlow)" />

  <!-- Top Status Row -->
  <g transform="translate(32, 32)">
    <circle cx="4" cy="0" r="4" fill="#38bdf8" class="pulse-dot" />
    <text x="16" y="4" fill="#38bdf8" font-size="11.5" font-weight="600" letter-spacing="0.5" class="mono">
      SOFTWARE DEVELOPER &#8226; DATA SYSTEMS
    </text>
  </g>

  <!-- Location Badge -->
  <text x="735" y="36" fill="#64748b" font-size="12" font-weight="500" class="sans">
    📍 Chandigarh, India
  </text>

  <!-- Divider -->
  <line x1="32" y1="52" x2="848" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- Name -->
  <text x="32" y="92" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="-0.5" class="sans">
    Vishal Singh
  </text>

  <!-- Subtitle Tagline -->
  <text x="32" y="122" fill="#94a3b8" font-size="14.5" font-weight="400" class="sans">
    Building software foundations, exploring data systems, and learning in public.
  </text>

  <!-- Subtle Animated Shimmer Line at Bottom -->
  <g clip-path="url(#bottomClip)">
    <rect x="0" y="147" width="300" height="2" fill="url(#shimmerLine)" class="shimmer-bar" />
  </g>

  <clipPath id="bottomClip">
    <rect x="2" y="2" width="876" height="146" rx="14" />
  </clipPath>
</svg>
