<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Ambient Corner Glow -->
    <radialGradient id="cornerGlow" cx="90%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Accent Line Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="146" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="876" height="146" rx="14" fill="url(#cornerGlow)" />

  <!-- Top Status Row -->
  <g transform="translate(32, 34)">
    <circle cx="4" cy="0" r="4.5" fill="#38bdf8" />
    <text x="18" y="4" fill="#38bdf8" font-size="11.5" font-weight="600" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      SOFTWARE DEVELOPER &#8226; DATA SYSTEMS
    </text>
  </g>

  <!-- Location Badge -->
  <text x="735" y="38" fill="#64748b" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    📍 Chandigarh, India
  </text>

  <!-- Divider -->
  <line x1="32" y1="54" x2="848" y2="54" stroke="#1e293b" stroke-width="1" />

  <!-- Name -->
  <text x="32" y="94" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="-0.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    Vishal Singh
  </text>

  <!-- Subtitle Tagline -->
  <text x="32" y="123" fill="#94a3b8" font-size="14.5" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    Building software foundations, exploring data systems, and learning in public.
  </text>

  <!-- Bottom Accent Highlight -->
  <rect x="32" y="146" width="816" height="2" rx="1" fill="url(#accentLine)" />
</svg>
