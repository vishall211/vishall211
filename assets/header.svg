<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Corner Ambient Glows with subtle breathing animation -->
    <radialGradient id="glowTopRight" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16">
        <animate attributeName="stop-opacity" values="0.12;0.22;0.12" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10">
        <animate attributeName="stop-opacity" values="0.06;0.16;0.06" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmer Scan Line -->
    <linearGradient id="shimmerScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Modern Grid Pattern -->
    <pattern id="subtleGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#334155" fill-opacity="0.45" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="876" height="186" rx="16" />
    </clipPath>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#subtleGrid)" clip-path="url(#cardClip)" />
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#glowTopRight)" clip-path="url(#cardClip)" />
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#glowBottomLeft)" clip-path="url(#cardClip)" />

  <!-- Abstract Ambient Floating Data Streams (Light & Atmospheric) -->
  <g clip-path="url(#cardClip)">
    <path d="M 540,150 Q 640,60 760,110 T 870,40" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" from="0" to="40" dur="16s" repeatCount="indefinite" />
    </path>
    <path d="M 480,180 Q 580,110 680,140 T 820,70" fill="none" stroke="#818cf8" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="3 5">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="20s" repeatCount="indefinite" />
    </path>

    <!-- Floating subtle particles -->
    <circle cx="640" cy="60" r="2" fill="#38bdf8" fill-opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="760" cy="110" r="2.5" fill="#818cf8" fill-opacity="0.35">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="810" cy="45" r="1.8" fill="#38bdf8" fill-opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Status Row -->
  <g transform="translate(36, 36)">
    <!-- Pulse Beacon Ring -->
    <circle cx="4" cy="0" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2">
      <animate attributeName="r" values="4;11;14" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="4" cy="0" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="4.5" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      SOFTWARE DEVELOPER &#8226; DATA SYSTEMS
    </text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(710, 36)">
    <text x="0" y="4" fill="#64748b" font-size="12.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      📍 Chandigarh, India
    </text>
  </g>

  <!-- Sleek Divider -->
  <line x1="36" y1="58" x2="844" y2="58" stroke="#1e293b" stroke-width="1" />

  <!-- Main Headline -->
  <text x="36" y="106" fill="#ffffff" font-size="36" font-weight="800" letter-spacing="-0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    Vishal Singh
  </text>

  <!-- Subtitle Tagline -->
  <text x="36" y="138" fill="#94a3b8" font-size="15" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    Building reliable software, exploring data engineering systems, and learning in public.
  </text>

  <!-- Focus Tags Row -->
  <g transform="translate(36, 168)">
    <rect x="0" y="-14" width="120" height="20" rx="10" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="0.8" />
    <text x="60" y="-0.5" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="500" font-family="ui-monospace, monospace">
      Data Pipelines
    </text>

    <rect x="130" y="-14" width="126" height="20" rx="10" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="0.8" />
    <text x="193" y="-0.5" text-anchor="middle" fill="#a5b4fc" font-size="10.5" font-weight="500" font-family="ui-monospace, monospace">
      Backend Services
    </text>

    <rect x="266" y="-14" width="108" height="20" rx="10" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="0.8" />
    <text x="320" y="-0.5" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="500" font-family="ui-monospace, monospace">
      Clean Code
    </text>

    <rect x="384" y="-14" width="138" height="20" rx="10" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="0.8" />
    <text x="453" y="-0.5" text-anchor="middle" fill="#f59e0b" font-size="10.5" font-weight="500" font-family="ui-monospace, monospace">
      Continuous Learner
    </text>

    <!-- Animated Profile Views Telemetry Pill (Bottom Right) -->
    <rect x="640" y="-14" width="168" height="20" rx="10" fill="#0c1929" stroke="#0284c7" stroke-width="0.9">
      <animate attributeName="stroke" values="#0284c7;#38bdf8;#0284c7" dur="3s" repeatCount="indefinite" />
    </rect>
    <circle cx="652" cy="-4" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="652" cy="-4" r="3.5" fill="none" stroke="#38bdf8" stroke-width="0.8">
      <animate attributeName="r" values="3.5;7.5;10" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="664" y="-0.5" fill="#94a3b8" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      VIEWS:
    </text>
    <text x="708" y="-0.5" fill="#38bdf8" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      1,420+
      <animate attributeName="fill" values="#38bdf8;#60a5fa;#38bdf8" dur="3s" repeatCount="indefinite" />
    </text>
    <rect x="774" y="-2" width="2" height="5" fill="#38bdf8" rx="0.5" />
    <rect x="778" y="-4" width="2" height="7" fill="#38bdf8" rx="0.5">
      <animate attributeName="height" values="4;8;4" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-2;-6;-2" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="782" y="-6" width="2" height="9" fill="#38bdf8" rx="0.5">
      <animate attributeName="height" values="6;10;6" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-3;-7;-3" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="786" y="-8" width="2" height="11" fill="#38bdf8" rx="0.5">
      <animate attributeName="height" values="7;12;7" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-9;-4" dur="1.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Subtle Shimmer Scan Line at Bottom -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="186" width="280" height="2" fill="url(#shimmerScan)">
      <animate attributeName="x" from="-300" to="900" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
