<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="radialGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      /* Flow Wave Animation */
      @keyframes flowWave {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .data-wave {
        stroke-dasharray: 20 10;
        animation: flowWave 6s linear infinite;
      }
      .data-wave-fast {
        stroke-dasharray: 12 8;
        animation: flowWave 3.5s linear infinite reverse;
      }

      /* Radar Pulse */
      @keyframes radarPulse {
        0% { r: 3px; opacity: 1; }
        100% { r: 10px; opacity: 0; }
      }
      .radar-ring {
        animation: radarPulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      /* Glowing Nodes */
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .node-1 { animation: nodeGlow 3s ease-in-out infinite; }
      .node-2 { animation: nodeGlow 4s ease-in-out 1s infinite; }
      .node-3 { animation: nodeGlow 2.5s ease-in-out 0.5s infinite; }

      /* Cursor */
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blinkCursor 0.9s step-end infinite; }

      /* Floating Badges */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .float-badge { animation: floatSlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Window -->
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="256" rx="16" fill="url(#radialGlow)" />

  <!-- Animated Waveforms in Background -->
  <path d="M 30,195 Q 120,165 220,190 T 420,185 T 620,195 T 850,180" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" class="data-wave" />
  <path d="M 30,205 Q 150,225 280,200 T 500,210 T 700,195 T 850,210" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5" class="data-wave-fast" />

  <!-- Constellation Network Nodes -->
  <g opacity="0.65">
    <line x1="680" y1="50" x2="760" y2="90" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="760" y1="90" x2="830" y2="60" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="760" y1="90" x2="800" y2="140" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="800" y1="140" x2="840" y2="120" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />

    <circle cx="680" cy="50" r="3" fill="#38bdf8" class="node-1" />
    <circle cx="760" cy="90" r="4" fill="#818cf8" class="node-2" filter="url(#glowFilter)" />
    <circle cx="830" cy="60" r="3" fill="#c084fc" class="node-3" />
    <circle cx="800" cy="140" r="3.5" fill="#38bdf8" class="node-1" />
    <circle cx="840" cy="120" r="2.5" fill="#a855f7" class="node-2" />
  </g>

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="876" height="38" rx="16" fill="#0b0f19" fill-opacity="0.85" />
  <line x1="2" y1="40" x2="878" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="40" cy="21" r="5" fill="#eab308" />
  <circle cx="56" cy="21" r="5" fill="#22c55e" />

  <!-- Console Title -->
  <text x="76" y="25" fill="#94a3b8" font-size="12" font-weight="500" class="mono">
    vishal.singh // dev-terminal ~ zsh
  </text>

  <!-- Live Status Radar Pill -->
  <g transform="translate(680, 10)">
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#082f49" fill-opacity="0.6" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="11" r="4" fill="#38bdf8" />
    <circle cx="14" cy="11" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-ring" />
    <text x="26" y="15" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="0.5" class="mono">
      BUILDING &amp; CODING
    </text>
  </g>

  <!-- Terminal Command Line Prompt -->
  <text x="30" y="74" fill="#a855f7" font-size="13" font-weight="600" class="mono">vishal@dev:~$</text>
  <text x="145" y="74" fill="#e2e8f0" font-size="13" font-weight="500" class="mono">git status --engineer "Vishal Singh"</text>
  <rect x="445" y="62" width="7" height="15" fill="#38bdf8" class="cursor" />

  <!-- Hero Name with Gradient -->
  <text x="30" y="118" fill="url(#textGrad)" font-size="36" font-weight="900" class="sans" letter-spacing="-0.8">
    Vishal Singh
  </text>
  <text x="275" y="118" fill="#cbd5e1" font-size="22" font-weight="500" class="sans">
    • Software Engineer &amp; Builder
  </text>

  <!-- Generalized Tagline -->
  <text x="30" y="148" fill="#94a3b8" font-size="14.5" font-weight="400" class="sans">
    Building scalable software, resilient data systems, and intuitive cross-platform applications.
  </text>

  <!-- Generalized Floating Capability Badges -->
  <g class="float-badge" transform="translate(30, 168)">
    <!-- Badge 1: Software Engineering -->
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#0b192c" stroke="#0284c7" stroke-width="1" />
    <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="700" class="mono">💻 SOFTWARE ENG</text>

    <!-- Badge 2: Data & Analytics -->
    <rect x="192" y="0" width="176" height="26" rx="6" fill="#092419" stroke="#10b981" stroke-width="1" />
    <text x="204" y="17" fill="#34d399" font-size="11" font-weight="700" class="mono">📊 DATA &amp; PIPELINES</text>

    <!-- Badge 3: Backend & APIs -->
    <rect x="380" y="0" width="168" height="26" rx="6" fill="#1b122c" stroke="#8b5cf6" stroke-width="1" />
    <text x="392" y="17" fill="#c084fc" font-size="11" font-weight="700" class="mono">⚡ BACKEND &amp; APIS</text>

    <!-- Badge 4: Products & Mobile -->
    <rect x="560" y="0" width="172" height="26" rx="6" fill="#241a0b" stroke="#f59e0b" stroke-width="1" />
    <text x="572" y="17" fill="#fbbf24" font-size="11" font-weight="700" class="mono">📱 APPS &amp; PRODUCTS</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="2" y="222" width="876" height="36" rx="0" fill="#050811" />
  <line x1="2" y1="222" x2="878" y2="222" stroke="#1e293b" stroke-width="1" />
  <circle cx="20" cy="240" r="3" fill="#22c55e" />
  <text x="32" y="244" fill="#64748b" font-size="11" class="mono">
    LOCATION: <tspan fill="#e2e8f0">CHANDIGARH, IN</tspan> | CORE: <tspan fill="#38bdf8">PYTHON • C++ • DART • SQL</tspan> | STATUS: <tspan fill="#34d399">OPEN TO ROLES</tspan>
  </text>
</svg>
