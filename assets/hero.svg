<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Name Accent Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <radialGradient id="glow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Terminal Window -->
    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.5; r: 3.5px; }
        50% { opacity: 1; r: 4.5px; }
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      .pulsing-dot {
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="5" y="5" width="890" height="300" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#windowShadow)" />
  <rect x="5" y="5" width="890" height="300" rx="14" fill="url(#glow)" />

  <!-- Window Header Bar -->
  <line x1="5" y1="46" x2="895" y2="46" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Controls -->
  <circle cx="30" cy="26" r="6" fill="#ef4444" />
  <circle cx="50" cy="26" r="6" fill="#eab308" />
  <circle cx="70" cy="26" r="6" fill="#22c55e" />

  <!-- Window Title -->
  <text x="100" y="30" fill="#94a3b8" font-size="12" font-weight="500" class="font-mono">
    vishal.singh // ai-systems-terminal ~ zsh
  </text>

  <!-- Status Badge Pill (Right Side) -->
  <rect x="690" y="16" width="185" height="22" rx="11" fill="#082f49" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
  <circle cx="706" cy="27" r="4" fill="#38bdf8" class="pulsing-dot" />
  <text x="718" y="31" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="0.5" class="font-mono">
    SYSTEM OPERATIONAL
  </text>

  <!-- Terminal Command Line Prompt -->
  <text x="32" y="80" fill="#c084fc" font-size="13.5" font-weight="600" class="font-mono">vishal@engineer:~$</text>
  <text x="180" y="80" fill="#f1f5f9" font-size="13.5" font-weight="500" class="font-mono">./init_profile --target "Machine Learning &amp; AI Systems"</text>
  <rect x="670" y="67" width="8" height="15" fill="#38bdf8" class="cursor-blink" />

  <!-- Profile Hero Title -->
  <text x="32" y="124" fill="url(#nameGrad)" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.5">
    Vishal Singh
  </text>
  <text x="205" y="124" fill="#94a3b8" font-size="20" font-weight="500" class="font-sans">
    • Data Science &amp; AI Systems Engineer
  </text>

  <!-- Profile Subtitle / Mission -->
  <text x="32" y="152" fill="#cbd5e1" font-size="13.5" font-weight="400" class="font-sans">
    Transforming complex real-world data &amp; telemetry streams into predictive engines and intuitive AI products.
  </text>

  <!-- Horizontal Divider -->
  <line x1="32" y1="172" x2="868" y2="172" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Meta Telemetry Grid (2 Columns x 2 Rows) -->
  <!-- Col 1, Row 1: FOCUS -->
  <text x="32" y="202" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">CORE FOCUS</text>
  <text x="135" y="202" fill="#e2e8f0" font-size="13" class="font-mono">
    <tspan fill="#38bdf8" font-weight="700">DTUMOS</tspan> (Urban Mobility Twin) • Multimodal AI
  </text>

  <!-- Col 2, Row 1: PIPELINES -->
  <text x="475" y="202" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">TELEMETRY</text>
  <text x="570" y="202" fill="#e2e8f0" font-size="13" class="font-mono">
    <tspan fill="#34d399" font-weight="700">GTFS-Realtime</tspan> Ingestion &amp; Spatial Models
  </text>

  <!-- Col 1, Row 2: EXPERIENCE -->
  <text x="32" y="238" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">EXPERIENCE</text>
  <text x="135" y="238" fill="#e2e8f0" font-size="13" class="font-mono">
    Data Science Intern @ <tspan fill="#c084fc" font-weight="700">Sabudh Foundation</tspan>
  </text>

  <!-- Col 2, Row 2: LOCATION -->
  <text x="475" y="238" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1" class="font-mono">LOCATION</text>
  <text x="570" y="238" fill="#e2e8f0" font-size="13" class="font-mono">
    Chandigarh, India • <tspan fill="#38bdf8">Open to Global Roles</tspan>
  </text>

  <!-- Bottom Terminal Status Bar -->
  <rect x="5" y="272" width="890" height="32" rx="0" fill="#080c14" />
  <line x1="5" y1="272" x2="895" y2="272" stroke="#1e293b" stroke-width="1" />
  <text x="32" y="293" fill="#64748b" font-size="11.5" class="font-mono">
    [STATUS] Latency: &lt;15ms | Buffer: Optimal | PyTorch: Ready | Status: Open to Opportunities
  </text>
  <text x="760" y="293" fill="#38bdf8" font-size="11.5" font-weight="600" class="font-mono">
    vishalx.vercel.app ↗
  </text>
</svg>
