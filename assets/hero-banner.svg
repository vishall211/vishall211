<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradient Background -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0a1026" />
      <stop offset="70%" stop-color="#0d1430" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Neon Glow Gradient for Name -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orbCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effect -->
    <filter id="superGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

      /* Glowing Stars Twinkle */
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .star-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-2 { animation: twinkle 4s ease-in-out 1s infinite; }
      .star-3 { animation: twinkle 2.5s ease-in-out 1.5s infinite; }
      .star-4 { animation: twinkle 3.5s ease-in-out 0.5s infinite; }

      /* Neon Border Shimmer */
      @keyframes borderMove {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      .animated-border {
        stroke-dasharray: 200 600;
        animation: borderMove 10s linear infinite;
      }

      /* Sine Wave Pulse */
      @keyframes waveStream {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .wave-line {
        stroke-dasharray: 15 10;
        animation: waveStream 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Box with Glowing Border -->
  <rect x="3" y="3" width="894" height="274" rx="20" fill="url(#heroBg)" />
  <rect x="3" y="3" width="894" height="274" rx="20" fill="url(#orbCyan)" />
  <rect x="3" y="3" width="894" height="274" rx="20" fill="url(#orbPurple)" />

  <!-- Outer Neon Frame -->
  <rect x="3" y="3" width="894" height="274" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="3" y="3" width="894" height="274" rx="20" fill="none" stroke="url(#neonBorder)" stroke-width="2.5" class="animated-border" />

  <!-- Background Data Flow Sine Waves -->
  <path d="M 0,210 Q 150,170 300,210 T 600,210 T 900,190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="wave-line" />
  <path d="M 0,225 Q 180,255 360,220 T 720,230 T 900,215" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.25" class="wave-line" />

  <!-- Twinkling Ambient Stars -->
  <circle cx="120" cy="50" r="2" fill="#38bdf8" class="star-1" />
  <circle cx="280" cy="40" r="1.5" fill="#ffffff" class="star-2" />
  <circle cx="680" cy="45" r="2" fill="#e879f9" class="star-3" />
  <circle cx="820" cy="80" r="2.5" fill="#38bdf8" class="star-4" filter="url(#superGlow)" />
  <circle cx="750" cy="180" r="1.5" fill="#ffffff" class="star-1" />
  <circle cx="160" cy="190" r="2" fill="#c084fc" class="star-3" />

  <!-- Top Status Badge Pill -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#082f49" fill-opacity="0.7" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#22c55e" filter="url(#superGlow)" />
    <text x="28" y="18" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" class="font-code">
      AI SYSTEMS ONLINE
    </text>
  </g>

  <!-- Location & Role Pill on Right -->
  <g transform="translate(640, 30)">
    <rect x="0" y="0" width="225" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.2" />
    <text x="18" y="18" fill="#a5b4fc" font-size="11" font-weight="600" class="font-code">
      📍 Chandigarh • Global Roles
    </text>
  </g>

  <!-- Main Hero Name -->
  <text x="35" y="115" fill="url(#neonTitle)" font-size="44" font-weight="900" class="font-main" letter-spacing="-1" filter="url(#superGlow)">
    Vishal Singh
  </text>

  <!-- Subtitle Tagline -->
  <text x="35" y="150" fill="#f8fafc" font-size="20" font-weight="600" class="font-main">
    Machine Learning &amp; AI Systems Engineer
  </text>
  <text x="35" y="176" fill="#94a3b8" font-size="14.5" font-weight="400" class="font-main">
    Turning chaotic telemetry streams into predictive intelligence and scalable multimodal AI products.
  </text>

  <!-- Feature Tags / Visual Badges Row -->
  <g transform="translate(35, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#0c1e38" stroke="#0284c7" stroke-width="1.2" />
    <text x="14" y="21" fill="#38bdf8" font-size="12" font-weight="700" class="font-code">⚡ PREDICTIVE ML</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="195" height="34" rx="8" fill="#241438" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="14" y="21" fill="#c084fc" font-size="12" font-weight="700" class="font-code" transform="translate(195, 0)">🤖 MULTIMODAL GENAI</text>

    <!-- Pill 3 -->
    <rect x="405" y="0" width="195" height="34" rx="8" fill="#0f291e" stroke="#10b981" stroke-width="1.2" />
    <text x="14" y="21" fill="#34d399" font-size="12" font-weight="700" class="font-code" transform="translate(405, 0)">📡 SPATIAL TELEMETRY</text>

    <!-- Pill 4 -->
    <rect x="615" y="0" width="215" height="34" rx="8" fill="#2e1d0f" stroke="#f59e0b" stroke-width="1.2" />
    <text x="14" y="21" fill="#fbbf24" font-size="12" font-weight="700" class="font-code" transform="translate(615, 0)">🚀 PRODUCT ENGINEERING</text>
  </g>
</svg>
