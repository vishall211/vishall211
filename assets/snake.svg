  <defs>
    <style>
      .font-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #64748b; }
      @keyframes slither {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(180px, 0px); }
        50% { transform: translate(180px, 48px); }
        75% { transform: translate(360px, 48px); }
        100% { transform: translate(540px, 0px); }
      }
      .snake-body {
        animation: slither 8s linear infinite;
      }
      @keyframes pulseFood {
        0%, 100% { fill: #39d353; r: 5px; }
        50% { fill: #f43f5e; r: 7px; }
      }
      .food-dot { animation: pulseFood 2s infinite ease-in-out; }
    </style>
  </defs>

