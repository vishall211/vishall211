<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <defs>
    <radialGradient id="laptopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Desk Surface -->
  <rect x="20" y="98" width="200" height="6" rx="3" fill="#1e293b" />

  <!-- Laptop Glow -->
  <ellipse cx="120" cy="82" rx="38" ry="18" fill="url(#laptopGlow)" />

  <!-- Laptop Base & Keyboard -->
  <polygon points="95,98 145,98 140,88 100,88" fill="#334155" />
  <rect x="104" y="90" width="32" height="5" rx="1" fill="#1e293b" />

  <!-- Laptop Screen -->
  <polygon points="100,88 140,88 138,58 102,58" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <polygon points="103,85 137,85 135,61 105,61" fill="#090d16" />
  <!-- Animated Code Lines on Screen -->
  <rect x="108" y="65" width="14" height="1.8" rx="0.9" fill="#38bdf8">
    <animate attributeName="width" values="14;18;12;14" dur="2s" repeatCount="indefinite" />
  </rect>
  <rect x="108" y="70" width="22" height="1.8" rx="0.9" fill="#818cf8">
    <animate attributeName="width" values="22;16;20;22" dur="2.5s" repeatCount="indefinite" />
  </rect>
  <rect x="108" y="75" width="10" height="1.8" rx="0.9" fill="#34d399" />
  <rect x="108" y="80" width="18" height="1.8" rx="0.9" fill="#38bdf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Coffee Mug with Animated Steam -->
  <rect x="165" y="86" width="12" height="12" rx="2" fill="#0284c7" />
  <path d="M 177,88 C 180,88 180,94 177,94" fill="none" stroke="#0284c7" stroke-width="1.2" />
  <path d="M 169,82 Q 172,76 169,70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <animate attributeName="d" values="M 169,82 Q 172,76 169,70; M 171,82 Q 168,76 171,70; M 169,82 Q 172,76 169,70" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Cat Body -->
  <!-- Swishing Tail -->
  <path d="M 55,90 Q 38,75 42,60" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round">
    <animate attributeName="d" values="M 55,90 Q 38,75 42,60; M 55,90 Q 32,85 36,68; M 55,90 Q 38,75 42,60" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Main Body -->
  <ellipse cx="70" cy="82" rx="18" ry="16" fill="#f8fafc" />

  <!-- Cat Head -->
  <circle cx="78" cy="62" r="14" fill="#f8fafc" />

  <!-- Ears -->
  <polygon points="67,54 72,40 77,52" fill="#f8fafc" />
  <polygon points="69,52 72,43 75,51" fill="#f472b6" />
  <polygon points="79,52 84,40 89,54" fill="#f8fafc" />
  <polygon points="81,51 84,43 87,52" fill="#f472b6" />

  <!-- Blinking Eyes -->
  <ellipse cx="74" cy="62" rx="2" ry="2.5" fill="#0f172a">
    <animate attributeName="ry" values="2.5;2.5;0.3;2.5;2.5" dur="4s" repeatCount="indefinite" keyTimes="0; 0.85; 0.9; 0.95; 1" />
  </ellipse>
  <ellipse cx="84" cy="62" rx="2" ry="2.5" fill="#0f172a">
    <animate attributeName="ry" values="2.5;2.5;0.3;2.5;2.5" dur="4s" repeatCount="indefinite" keyTimes="0; 0.85; 0.9; 0.95; 1" />
  </ellipse>

  <!-- Nose & Whiskers -->
  <polygon points="78,66 80,66 79,67.5" fill="#f472b6" />
  <line x1="68" y1="65" x2="60" y2="64" stroke="#94a3b8" stroke-width="0.8" />
  <line x1="68" y1="67" x2="60" y2="68" stroke="#94a3b8" stroke-width="0.8" />
  <line x1="90" y1="65" x2="98" y2="64" stroke="#94a3b8" stroke-width="0.8" />
  <line x1="90" y1="67" x2="98" y2="68" stroke="#94a3b8" stroke-width="0.8" />

  <!-- Animated Typing Paws -->
  <ellipse cx="94" cy="86" rx="4" ry="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6">
    <animate attributeName="cy" values="86;82;86" dur="0.35s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="104" cy="86" rx="4" ry="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6">
    <animate attributeName="cy" values="82;86;82" dur="0.35s" repeatCount="indefinite" />
  </ellipse>

  <!-- Floating Heart / Thought Bubble -->
  <g transform="translate(88, 32)">
    <circle cx="0" cy="0" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8">
      <animate attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <path d="M -3,-1 A 2,2 0 0,1 0,-1 A 2,2 0 0,1 3,-1 Q 3,2 0,4 Q -3,2 -3,-1 Z" fill="#38bdf8">
      <animate attributeName="fill" values="#38bdf8;#818cf8;#38bdf8" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
